name: Ellenőrzések

# Runs on every pull request, and before every deploy (deploy.yml calls it).
# A red job here blocks the deploy: deploy.yml waits for ALL of them.
#
# The jobs run side by side on separate runners (a public repo's minutes are
# free): the browser tests, by far the slowest part, are split in four shards.

on:
  pull_request:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Lint and the type-checked build.
  quality:
    name: Lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (a UTC-napos dátumkezelést is tiltja)
        run: npm run lint
      - name: Build (típusellenőrzéssel)
        run: npm run build

  # The app is used in Budapest; tests default to Europe/Budapest (see
  # vite.config.ts). Two more zones catch date code that only works by
  # accident in one of them. The Budapest run includes the pipeline snapshot.
  unit:
    name: Unit tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Budapest, UTC, America/New_York]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # Browser tests of the built app, split in four shards (the tests are
  # fullyParallel, so Playwright splits them test by test). Each runner builds
  # the app itself: 20 s are cheaper than passing an artifact around.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser download is cached by Playwright's version (one slow
      # download once took 8 minutes). The system libraries are installed
      # either way; with a cache hit only those are left to do.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright Chromium (download + system libraries)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright system libraries (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests (e2e), shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "true"
      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
